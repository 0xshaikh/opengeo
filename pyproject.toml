[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengeo"
version = "0.1.0"
description = "Keyless AI-search visibility (GEO), SEO content briefs, on-page content quality and white-label PDF reports."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "0xshaikh", email = "0xshaikh@users.noreply.github.com"}]
keywords = [
    "seo", "generative-engine-optimization", "geo", "ai-visibility",
    "content-briefs", "seo-reports", "self-hosted", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Marketing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
opengeo = "opengeo.cli:main"

[project.urls]
Homepage = "https://github.com/0xshaikh/opengeo"
Repository = "https://github.com/0xshaikh/opengeo"
Issues = "https://github.com/0xshaikh/opengeo/issues"

[tool.setuptools.packages.find]
include = ["opengeo*"]

[tool.setuptools.package-data]
opengeo = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: tests that require outbound internet access",
]
